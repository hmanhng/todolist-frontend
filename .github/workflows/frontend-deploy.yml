name: Build Frontend Image to GHCR

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: ${{ github.event.release.tag_name }}
  ARGOCD_REPO: hmanhng/argocd-todolist
  ARGOCD_BRANCH: master

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=/api/todos
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout Argo CD manifests
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ARGOCD_REPO }}
          ref: ${{ env.ARGOCD_BRANCH }}
          token: ${{ secrets.ARGOCD_REPO_TOKEN }}
          path: argocd-todolist

      - name: Update Argo CD frontend image tag
        run: |
          cd argocd-todolist
          sed -i "s|image: ghcr.io/hmanhng/todolist-frontend:.*|image: ghcr.io/hmanhng/todolist-frontend:${IMAGE_TAG}|" apps/frontend/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            exit 0
          fi
          git add apps/frontend/deployment.yaml
          git commit -m "chore: update frontend image to ${IMAGE_TAG}"
          git push origin "HEAD:${ARGOCD_BRANCH}"
